name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Dev tooling (semantic-release) needs Node >=22.14 but only runs in the release job;
      # the library itself supports Node 20, which this matrix still verifies.
      - run: yarn install --frozen-lockfile --ignore-engines

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test --run --coverage

      - run: yarn build

      - uses: codecov/codecov-action@v4
        if: matrix.node-version == 20
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: yarn install --frozen-lockfile

      # Intentionally a no-op while the package has no runtime dependencies: the
      # `dependencies` group is empty, so nothing can fail here. It starts gating
      # as soon as a runtime dependency is added.
      - name: Audit runtime dependencies (blocking)
        run: yarn audit --groups dependencies --level moderate

      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: yarn audit --level moderate

  release:
    needs: [check, audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: yarn install --frozen-lockfile

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          HUSKY: "0"
        run: yarn semantic-release
